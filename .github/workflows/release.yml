# Builds the signed release APK on Linux (same OS as F-Droid's build, for reproducibility)
# and attaches it to the GitHub release for the pushed tag.
# Secrets: KEYSTORE_BASE64 (base64 of release.jks), KEYSTORE_PASSWORD (store and key password).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.2' }
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=taro\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="taro-music-${TAG#v}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          # Fails if this version code has no notes.
          code="$(sed -n 's/^version:.*+\([0-9]*\).*/\1/p' pubspec.yaml)"
          gh release create "$TAG" "$apk" --title "$TAG" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$code.txt" --generate-notes
